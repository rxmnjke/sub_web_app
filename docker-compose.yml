version: "3.9"

services:
  sub_app:
    build: ./sub_app
    container_name: vless-sub-app
    restart: unless-stopped
    environment:
      - PORT=8080
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    volumes:
      - ./sub_app/data:/app/data
    networks:
      - subnet

  nginx:
    image: nginx:1.27-alpine
    container_name: vless-sub-nginx
    restart: unless-stopped
    depends_on:
      - sub_app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - subnet

networks:
  subnet:
    driver: bridge
